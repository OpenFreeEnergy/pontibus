name: pontibus
channels:
  - conda-forge
dependencies:
  - pip
  - gufe >=1.13
  - openfe >=1.13
  - openff-toolkit >0.16.0
  - openff-interchange >=0.5
  - openff-nagl-base >=0.3.3
  - openff-packmol
  # packmol from ambertools 25+ hangs in tests
  - ambertools <25
  # OpenFE stack deps
  - duecredit<0.10
  - kartograf>=1.0.0
  - konnektor
  - lomap2>=3.0.0
  - numpy
  - networkx
  - rdkit
  - packaging
  - pydantic >=2.0
  - pyyaml
  - coverage
  - cinnabar ~=0.6
  - click
  - typing-extensions
  - openmm >=8.4,<8.6
  - openmmtools >=0.25.0
  - openmmforcefields
  - openfe-analysis >=0.3.1
  - plugcli
  - tqdm
  # Testing deps
  - pytest
  - pytest-cov
  - pytest-timeout
  - pytest-xdist
